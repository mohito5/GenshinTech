<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Профиль</title>
<link rel="stylesheet" href="style-home.css">
<link rel="stylesheet" href="general.css">
<style>
  body { font-family: Arial, sans-serif; padding: 2vh; height: 100vh; margin: 0;

  box-sizing: border-box;}
  
</style>

</head>
<body>
<h1>Profile</h1>
<button class="liquid" value="Home">Home</button>
<button id="liquid" value="Home">Home</button>


<script>
  const materialsList = ['Мечи', 'Щиты', 'Кристаллы'];
  
  // Создаем поля для ввода ваших материалов
  function createMaterialsInputs() {
    const container = document.getElementById('materials_have');
    materialsList.forEach(mat => {
      const label = document.createElement('label');
      label.textContent = `${mat}: `;
      const input = document.createElement('input');
      input.type = 'number';
      input.min = 0;
      input.value = 0;
      input.id = `have_${mat}`;
      label.appendChild(input);
      container.appendChild(label);
      container.appendChild(document.createElement('br'));
    });
  }

  createMaterialsInputs();

  // Обновление отображения уровня
  document.getElementById('level').addEventListener('input', () => {
    document.getElementById('level_value').textContent = document.getElementById('level').value;
  });

  // Основная функция расчета требований
  document.getElementById('calculateBtn').onclick = () => {
    const level = parseInt(document.getElementById('level').value);
    const skillLevels = [
      parseInt(document.getElementById('skill1').value),
      parseInt(document.getElementById('skill2').value),
      parseInt(document.getElementById('skill3').value)
    ];

    // Получаем требования в зависимости от уровня
    const reqs = getMaterialsForLevel(level);
    // Увеличиваем требования в зависимости от навыков (например, +10% на каждый уровень навыка)
    const skillMultiplier = 1 + 0.1 * Math.max(...skillLevels);
    const totalReqs = {};
    for (let mat of materialsList) {
      totalReqs[mat] = Math.ceil(reqs[mat] * skillMultiplier);
    }

    // отображаем
    const container = document.getElementById('materials_needed');
    container.innerHTML = '';
    for (let mat of materialsList) {
      const div = document.createElement('div');
      div.innerHTML = `${mat}: ${totalReqs[mat]} шт.`;
      container.appendChild(div);
    }

    // сохраняем текущие требования в глобальную переменную
    window.currentRequirements = totalReqs;
  };

  // Функция получения требований по уровню
  function getMaterialsForLevel(level) {
    // Для примера — линейное увеличение по уровням
    const base = {
      'Мечи': 1,
      'Щиты': 1,
      'Кристаллы': 2
    };
    const maxLevel = 90;
    const factor = level / maxLevel; // 0..1
    const result = {};
    for (let mat of materialsList) {
      result[mat] = Math.ceil(base[mat] * (1 + 4 * factor)); // от 1 до 5 раз базовое число
    }
    return result;
  }

  // Сохраняем данные
  document.getElementById('saveBtn').onclick = () => {
    const userMaterials = {};
    for (let mat of materialsList) {
      userMaterials[mat] = parseInt(document.getElementById(`have_${mat}`).value) || 0;
    }
    
    const data = {
      character: document.getElementById('character').value,
      level: document.getElementById('level').value,
      skills: {
        skill1: parseInt(document.getElementById('skill1').value),
        skill2: parseInt(document.getElementById('skill2').value),
        skill3: parseInt(document.getElementById('skill3').value)
      },
      requirements: window.currentRequirements || {},
      haveMaterials: userMaterials
    };
    // Отправляем в бота
    window.Telegram.WebApp.sendData(JSON.stringify({ type: 'user_data', data }));
  };

  // Страница и логика для показа статуса
  document.getElementById('showStatusBtn').onclick = () => {
    // Получим сохранённые данные из user_data
    // В бота — обработка
  };

</script>
</body>
</html>
